name: Correct owner packet regression expectations

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
          fetch-depth: 0
      - name: Correct only diagnosed packet expectations and self-clean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/owner-approve-somatic-altered.yml')
          lines = p.read_text().splitlines()

          deferred = "deferredIncludes: ['IC.DEEP_CHILD_DIALOGUE', 'SOM.DEEP_BRAINSPOTTING', 'SOM.EMDR_DISCRETE', 'SOM.EMDR_DEVELOPMENTAL']"
          hits = [i for i, line in enumerate(lines) if deferred in line]
          if len(hits) != 2:
              raise SystemExit(f'Expected two acute deferred-expectation lines, found {len(hits)}')
          for i in reversed(hits):
              if "blockedIncludes: ['ROUTE.GO_INWARD', 'ROUTE.ALTERED_STABLE_THERAPY']," not in lines[i-1]:
                  raise SystemExit('Deferred expectation was not paired with the exact altered-state block assertion.')
              lines[i-1] = lines[i-1].replace("],", "]")
              del lines[i]

          selected = "selectedIncludes: ['ROUTE.ALTERED_STABLE_THERAPY', 'IC.ALTERED_STATE_GATE', 'IC.DEEP_CHILD_DIALOGUE'],"
          hits = [i for i, line in enumerate(lines) if selected in line]
          if len(hits) != 1:
              raise SystemExit(f'Expected one stable altered-state selectedIncludes line, found {len(hits)}')
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if "requiredNuancePatterns: ['lack of habitual inner speech', 'articulate writing']" not in lines[i+1]:
              raise SystemExit('Stable altered-state nuance assertion did not match the diagnosed form.')
          lines[i:i+2] = [
              indent + "selectedIncludes: ['ROUTE.ALTERED_STABLE_THERAPY', 'IC.ALTERED_STATE_GATE'],",
              indent + "matchedIncludes: ['IC.DEEP_CHILD_DIALOGUE'],",
              indent + "requiredNuancePatterns: ['lack of habitual inner speech'],",
              indent + "forbiddenOverclaimPatterns: ['articulate writing']"
          ]

          old = "expected: { selectedIncludes: ['ROUTE.ALTERED_AFTERMATH', 'SOM.MEANING_INTEGRATION', 'ROUTE.GO_INWARD'] }"
          hits = [i for i, line in enumerate(lines) if old in line]
          if len(hits) != 1:
              raise SystemExit(f'Expected one aftermath expectation, found {len(hits)}')
          lines[hits[0]] = lines[hits[0]].replace(old, "expected: { selectedIncludes: ['ROUTE.ALTERED_AFTERMATH', 'ROUTE.GO_INWARD'], matchedIncludes: ['SOM.MEANING_INTEGRATION'] }")

          p.write_text('\n'.join(lines) + '\n')
          PY
          rm -f .github/workflows/diagnose-owner-packet-cases.yml
          rm -f .github/workflows/fix-owner-approval-cases.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[packet-tests] Correct diagnosed owner-approval regression expectations'
          git push origin HEAD:task/somatic-altered-guide-sync-20260916
