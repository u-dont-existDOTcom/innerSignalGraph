name: Correct owner packet regression expectations

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
          fetch-depth: 0
      - name: Correct only diagnosed packet expectations and self-clean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/owner-approve-somatic-altered.yml')
          s = p.read_text()

          old = """                blockedIncludes: ['ROUTE.GO_INWARD', 'ROUTE.ALTERED_STABLE_THERAPY'],
                deferredIncludes: ['IC.DEEP_CHILD_DIALOGUE', 'SOM.DEEP_BRAINSPOTTING', 'SOM.EMDR_DISCRETE', 'SOM.EMDR_DEVELOPMENTAL']"""
          new = """                blockedIncludes: ['ROUTE.GO_INWARD', 'ROUTE.ALTERED_STABLE_THERAPY']"""
          if s.count(old) != 2:
              raise SystemExit(f'Expected two acute deferred-expectation blocks, found {s.count(old)}')
          s = s.replace(old, new)

          old = """                selectedIncludes: ['ROUTE.ALTERED_STABLE_THERAPY', 'IC.ALTERED_STATE_GATE', 'IC.DEEP_CHILD_DIALOGUE'],
                requiredNuancePatterns: ['lack of habitual inner speech', 'articulate writing']"""
          new = """                selectedIncludes: ['ROUTE.ALTERED_STABLE_THERAPY', 'IC.ALTERED_STATE_GATE'],
                matchedIncludes: ['IC.DEEP_CHILD_DIALOGUE'],
                requiredNuancePatterns: ['lack of habitual inner speech'],
                forbiddenOverclaimPatterns: ['articulate writing']"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected one stable altered-state expectation block, found {s.count(old)}')
          s = s.replace(old, new)

          old = "expected: { selectedIncludes: ['ROUTE.ALTERED_AFTERMATH', 'SOM.MEANING_INTEGRATION', 'ROUTE.GO_INWARD'] }"
          new = "expected: { selectedIncludes: ['ROUTE.ALTERED_AFTERMATH', 'ROUTE.GO_INWARD'], matchedIncludes: ['SOM.MEANING_INTEGRATION'] }"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one aftermath expectation, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm -f .github/workflows/diagnose-owner-packet-cases.yml
          rm -f .github/workflows/fix-owner-approval-cases.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[packet-tests] Correct diagnosed owner-approval regression expectations'
          git push origin HEAD:task/somatic-altered-guide-sync-20260916
