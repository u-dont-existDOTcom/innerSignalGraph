name: Temporary intuition proposal generator

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-intuition-proposal.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Refresh compiled graph contract artifacts
        run: npm run graph:compile
      - name: Regenerate current authoring projection
        run: npm run authoring:project
      - name: Create governed proposal skeleton
        run: >-
          npm run authoring:proposal:new --
          --id intuition-calibration-r1
          --node IC.BORROW_ONE_FUNCTION
          --node IC.ADULT_APPRENTICE
          --node IC.DIFFERENTIATION
          --node IC.GUIDE_LATER
          --node IC.REALIZATION_LOVE_INTEGRATION
          --node IC.SUICIDAL_SELF_DEATH_INQUIRY
          --regression G025
          --regression G026
          --regression G027
          --regression G028
          --regression G029
          --regression G030
          --regression G031
          --regression G032
      - name: Remove one-shot workflow and commit generated authority snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-intuition-proposal.yml
          git add guide-graphs/compiled authoring/obsidian/current authoring/obsidian/proposals/intuition-calibration-r1
          git commit -m "authoring: initialize intuition calibration proposal"
          git push origin HEAD:task/intuition-calibration-20260902
