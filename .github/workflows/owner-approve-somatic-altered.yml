name: Owner-approved somatic altered reconciliation

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916
    paths:
      - tasks/somatic-altered-guide-sync-20260916/OWNER-APPROVAL-TRIGGER

permissions:
  contents: write

concurrency:
  group: owner-approved-somatic-altered-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
          fetch-depth: 0

      - name: Set up repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Refresh only the deterministic reviewed-policy benchmark fingerprint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/autopilot/therapy-latency-benchmark.mjs')
          s = p.read_text()
          old = 'f82024bfb1c8d835a54cf7fa9c7698e69035f8b713e7d8a0742eff67a2f6efa9'
          new = 'f898656cb46a5f9971f25cc6f259169bf09c8c29ceea254b7866e72abeed5941'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one pre-reconciliation reviewed fingerprint, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - name: Apply exact owner approval and reconcile with complete gates
        env:
          BASE_SHA: 5bc037327392eef45b3c0f7bf4e3be0a3f341245
          PROPOSAL_ID: somatic-altered-guide-sync-20260916
          REVIEWED_HEAD: 827e7f771aaf2b3ad9966f92be79e14b4c423772
          DECIDED_AT: 2026-09-16T19:03:00.000Z
          OWNER_NOTE: Owner approved all five grouped semantic decisions in Chat, covering all 31 exact decision cards.
        run: node tasks/somatic-altered-guide-sync-20260916/approval/apply-owner-approved-reconciliation.mjs

      - name: Commit owner-approved reconciliation artifacts
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          test -n "$(git status --porcelain --untracked-files=all | grep -v '^?? .github/workflows/' || true)"
          git commit -m '[owner-approved-reconciled] Record somatic and altered-state approval'
          git push origin HEAD:task/somatic-altered-guide-sync-20260916
