name: Owner-approved somatic altered reconciliation

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916
    paths:
      - tasks/somatic-altered-guide-sync-20260916/OWNER-APPROVAL-TRIGGER

permissions:
  contents: read

concurrency:
  group: owner-approved-somatic-altered-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
          fetch-depth: 0

      - name: Set up repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Diagnose exact post-reconciliation package gate without committing
        env:
          BASE_SHA: 5bc037327392eef45b3c0f7bf4e3be0a3f341245
          PROPOSAL_ID: somatic-altered-guide-sync-20260916
          DECIDED_AT: 2026-09-16T19:03:00.000Z
          OWNER_NOTE: Owner approved all five grouped semantic decisions in Chat, covering all 31 exact decision cards.
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tasks/somatic-altered-guide-sync-20260916/approval/apply-owner-approved-reconciliation.mjs')
          s = p.read_text()
          old = 'runCompleteGates: true'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one complete-gate flag, found {s.count(old)}')
          p.write_text(s.replace(old, 'runCompleteGates: false'))
          PY
          node tasks/somatic-altered-guide-sync-20260916/approval/apply-owner-approved-reconciliation.mjs > "$RUNNER_TEMP/reconcile.out"
          set +e
          npm run verify > "$RUNNER_TEMP/post-reconcile-verify.log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            echo '=== exact post-reconciliation verify tail ==='
            tail -n 240 "$RUNNER_TEMP/post-reconcile-verify.log"
            exit "$status"
          fi
          echo 'POST_RECONCILIATION_VERIFY_PASS'
