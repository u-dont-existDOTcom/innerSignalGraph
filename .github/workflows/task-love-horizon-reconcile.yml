name: Owner-approved love-horizon reconciliation

on:
  push:
    branches: [task/love-horizon-map-20260901]

permissions:
  contents: write

concurrency:
  group: owner-approved-love-horizon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/love-horizon-map-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Build owner-approved packet and reconcile canonical graph authority
        run: node scripts/tmp-reconcile-love-horizon.mjs | tee /tmp/love-horizon-reconciliation.json

      - name: Confirm reconciled proposal and clean deterministic authority
        run: |
          grep -q '^status: reconciled$' authoring/obsidian/proposals/love-horizon-r1/proposal.md
          npm run authoring:check
          npm run authoring:maps:check
          git diff --check

      - name: Remove one-shot reconciliation machinery
        run: rm -f scripts/tmp-reconcile-love-horizon.mjs .github/workflows/task-love-horizon-reconcile.yml

      - name: Commit reconciled canonical map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: reconcile love-horizon therapy map authority'
          git push origin HEAD:task/love-horizon-map-20260901
