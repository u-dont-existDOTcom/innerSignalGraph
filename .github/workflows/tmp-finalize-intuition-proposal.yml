# final retry after verified inventory drift only
name: Temporary intuition proposal finalizer

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-finalize-intuition-proposal.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Persist semantic-asset packet verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/guide-packet/verifier.mjs')
          s = p.read_text()
          anchor = '''function embeddedPdfSourceMap(layout, source) {
            return {
              guideId: source.id,
              file: pathBasename(source.sourcePath),
              sections: layout.pdfSections.filter((section) => section.sourceId === source.id).map((section) => ({ id: section.id, sourceId: section.sourceId, pages: section.pages, sha256: source.sourceSha256, excerpt: `PDF source pages ${section.pages.join(", ")}` }))
            };
          }
          '''
          insert = '''function embeddedSemanticAssetSourceMap(data) {
            const semanticAssets = JSON.parse(data.toString("utf8"));
            if (!semanticAssets || !Array.isArray(semanticAssets.items)) throw new Error("semantic-assets.json must contain an items array.");
            const seen = new Set();
            return {
              guideId: "semantic-assets",
              file: "semantic-assets.json",
              sections: semanticAssets.items.map((item) => {
                if (!item || typeof item.id !== "string" || !item.id.startsWith("ASSET.") || seen.has(item.id)) throw new Error("Semantic asset ids must be unique ASSET.* strings.");
                if (!Array.isArray(item.claims) || !item.claims.length || item.claims.some((claim) => typeof claim !== "string" || !claim.trim())) throw new Error(`Semantic asset ${item.id} must contain explicit non-empty claims.`);
                seen.add(item.id);
                const semanticRecord = {
                  claims: item.claims,
                  graphRefs: Array.isArray(item.graphRefs) ? item.graphRefs : [],
                  role: item.role ?? "instructional-visual",
                  section: item.section ?? item.id,
                  source: item.source ?? "owner-described-visual"
                };
                return {
                  id: item.id,
                  heading: item.section ?? item.id,
                  lineStart: null,
                  lineEnd: null,
                  sha256: sha256(JSON.stringify(semanticRecord)),
                  excerpt: item.claims.join(" ").slice(0, 1000),
                  role: semanticRecord.role,
                  graphRefs: semanticRecord.graphRefs,
                  source: semanticRecord.source
                };
              })
            };
          }

          '''
          if 'function embeddedSemanticAssetSourceMap(data)' not in s:
              if anchor not in s:
                  raise SystemExit('embeddedPdfSourceMap anchor missing')
              s = s.replace(anchor, anchor + '\n' + insert)
          pdf_branch = 'else if (source.format === "pdf") expected = embeddedPdfSourceMap(layout, source);'
          semantic_branch = 'else if (source.format === "json" && source.id === "semantic-assets") expected = embeddedSemanticAssetSourceMap(data);'
          if semantic_branch not in s:
              if pdf_branch not in s:
                  raise SystemExit('pdf source verification branch missing')
              s = s.replace(pdf_branch, semantic_branch + '\n        ' + pdf_branch, 1)
          p.write_text(s)
          PY
      - name: Update deterministic source inventories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/authoring-projection.test.mjs')
          s = p.read_text()
          s = s.replace('assert.equal(keys.filter((item) => item.includes("/sources/")).length, 68);', 'assert.equal(keys.filter((item) => item.includes("/sources/")).length, 73);')
          s = s.replace('assert.equal(keys.filter((item) => item.includes("/governance/amendments/")).length, 15);', 'assert.equal(keys.filter((item) => item.includes("/governance/amendments/")).length, 19);')
          p.write_text(s)

          p = Path('tests/guide-graph.test.mjs')
          s = p.read_text()
          s = s.replace('assert.equal(bundle.stats.ownerAmendmentCount, 15);', 'assert.equal(bundle.stats.ownerAmendmentCount, 19);')
          needle = 'assert.ok(bundle.sourceMaps.some((item) => item.guideId === "vagal-blitz-source"));'
          addition = needle + '\n  assert.ok(bundle.sourceMaps.some((item) => item.guideId === "semantic-assets"));'
          if 'guideId === "semantic-assets"' not in s:
              if needle not in s:
                  raise SystemExit('semantic asset source assertion anchor missing')
              s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflows before verification
        run: |
          git rm .github/workflows/tmp-intuition-verify.yml
          git rm .github/workflows/tmp-finalize-intuition-proposal.yml
      - name: Build proposal candidate
        run: npm run authoring:proposal:build -- --id intuition-calibration-r1
      - name: Verify proposal candidate
        run: npm run authoring:proposal:check -- --id intuition-calibration-r1
      - name: Regenerate current canonical documentation map
        run: npm run authoring:maps
      - name: Verify current map integrity
        run: npm run authoring:maps:check
      - name: Run full repository verification
        run: npm run verify
      - name: Commit verified candidate and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/guide-packet/verifier.mjs tests/authoring-projection.test.mjs tests/guide-graph.test.mjs authoring/obsidian/proposals/intuition-calibration-r1 docs authoring/obsidian/current .github/workflows
          git commit -m "proposal: verify intuition calibration candidate"
          git push origin HEAD:task/intuition-calibration-20260902
