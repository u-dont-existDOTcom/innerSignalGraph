name: Temporary intuition proposal rebase

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-rebase-intuition-proposal.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Label structured semantic source records correctly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/authoring/projection.mjs')
          s = p.read_text()
          old1 = 'const locatorKind = source.pages ? "pdf-pages" : source.lineStart ? "text-lines" : "amendment-record";'
          new1 = 'const locatorKind = source.pages ? "pdf-pages" : source.lineStart ? "text-lines" : source.guideId === "owner-amendments" ? "amendment-record" : "structured-record";'
          old2 = 'const locator = source.pages ? `Pages ${source.pages.join(", ")}` : source.lineStart ? `Lines ${source.lineStart}–${source.lineEnd}` : "Structured owner-amendment record";'
          new2 = 'const locator = source.pages ? `Pages ${source.pages.join(", ")}` : source.lineStart ? `Lines ${source.lineStart}–${source.lineEnd}` : source.guideId === "owner-amendments" ? "Structured owner-amendment record" : "Structured semantic source record";'
          if old1 not in s or old2 not in s:
              raise SystemExit('projection locator patch target missing')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
      - name: Remove stale proposal base
        run: rm -rf authoring/obsidian/proposals/intuition-calibration-r1
      - name: Refresh compiled graph and source artifacts
        run: npm run graph:compile
      - name: Regenerate current authoring projection
        run: npm run authoring:project
      - name: Recreate governed proposal skeleton
        run: >-
          npm run authoring:proposal:new --
          --id intuition-calibration-r1
          --node IC.BORROW_ONE_FUNCTION
          --node IC.ADULT_APPRENTICE
          --node IC.DIFFERENTIATION
          --node IC.GUIDE_LATER
          --node IC.REALIZATION_LOVE_INTEGRATION
          --node IC.SUICIDAL_SELF_DEATH_INQUIRY
          --regression G025
          --regression G026
          --regression G027
          --regression G028
          --regression G029
          --regression G030
          --regression G031
          --regression G032
      - name: Remove one-shot workflow and commit rebased proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-rebase-intuition-proposal.yml
          git add src/authoring/projection.mjs guide-graphs/compiled guide-graphs/source-maps guide-graphs/reports authoring/obsidian/current authoring/obsidian/proposals/intuition-calibration-r1
          git commit -m "authoring: rebase intuition proposal on semantic asset sources"
          git push origin HEAD:task/intuition-calibration-20260902
