# diagnostic pass for exact regression failures
name: Temporary intuition proposal verification

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-intuition-verify.yml

permissions:
  contents: read

jobs:
  verify-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Diagnose proposal candidate
        run: |
          node --input-type=module <<'NODE'
          import { projectRoot } from './src/core/config.mjs';
          import { materializeProposal } from './src/authoring/proposal-builder.mjs';
          try {
            await materializeProposal({ root: projectRoot, id: 'intuition-calibration-r1' });
            console.log('proposal materialized successfully');
          } catch (error) {
            console.error(JSON.stringify({ code: error.code, message: error.message, details: error.details }, null, 2));
            process.exit(1);
          }
          NODE
