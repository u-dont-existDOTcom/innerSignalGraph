name: Temporary approved intuition reconciliation

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-approve-reconcile-intuition.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Confirm only the one-shot workflow changed after the independently reviewed head
        run: |
          git merge-base --is-ancestor 4fdaaeed00d9a655e33728fa747a7d02866df901 HEAD
          test "$(git diff --name-only 4fdaaeed00d9a655e33728fa747a7d02866df901 HEAD)" = ".github/workflows/tmp-approve-reconcile-intuition.yml"
      - name: Rebuild the exact governed candidate
        run: |
          npm run authoring:proposal:build -- --id intuition-calibration-r1
          npm run authoring:proposal:check -- --id intuition-calibration-r1
      - name: Record explicit owner approval in the exact proposal packet
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { createStoredZip, readZipEntries } from "./src/core/zip.mjs";
          import { canonicalJson } from "./src/guide-packet/contract.mjs";
          import { sha256Bytes } from "./src/authoring/canonical-json.mjs";

          const candidatePath = "authoring/.build/intuition-calibration-r1/packet/proposal.zip";
          const approvedPath = "authoring/.build/intuition-calibration-r1/packet/approved.zip";
          const candidate = await fs.readFile(candidatePath);
          const entries = readZipEntries(candidate);
          const decisions = JSON.parse(entries.get("audit/owner-decisions.json").toString("utf8"));
          if (!Array.isArray(decisions.cards) || decisions.cards.length !== 40) {
            throw new Error(`Expected exactly 40 reviewed decision cards; found ${decisions.cards?.length ?? "missing"}.`);
          }
          const decidedAt = new Date().toISOString();
          const ownerNote = "Owner explicitly approved PR #26 after an independent GPT-5.6 Pro pass found no blocking semantic, safety, regression, provenance, or implementation issue.";
          decisions.cards = decisions.cards.map((card) => ({ ...card, status: "approve", ownerNote, decidedAt }));
          decisions.allApproved = true;
          decisions.status = "approved";
          decisions.decidedAt = decidedAt;

          const manifest = JSON.parse(entries.get("manifest.json").toString("utf8"));
          if (manifest.proposalId !== "intuition-calibration-r1" || manifest.packetId !== "authoring-intuition-calibration-r1") {
            throw new Error("Candidate packet identity does not match the reviewed proposal.");
          }
          manifest.status = "approved";
          manifest.candidateOnly = false;
          manifest.approvalRequired = false;
          manifest.approvedAt = decidedAt;
          manifest.approvalDecisionHash = createHash("sha256").update(Buffer.from(canonicalJson(decisions))).digest("hex");
          entries.set("manifest.json", Buffer.from(canonicalJson(manifest)));
          entries.set("audit/owner-decisions.json", Buffer.from(canonicalJson(decisions)));
          entries.delete("SHA256SUMS.txt");
          const sums = [...entries.entries()]
            .sort(([left], [right]) => left < right ? -1 : left > right ? 1 : 0)
            .map(([name, data]) => `${createHash("sha256").update(data).digest("hex")}  ${name}`)
            .join("\n") + "\n";
          entries.set("SHA256SUMS.txt", Buffer.from(sums));
          const approved = createStoredZip(
            [...entries.entries()].map(([name, data]) => ({ name, data })),
            new Date("1980-01-01T00:00:00.000Z")
          );
          await fs.writeFile(approvedPath, approved);
          const metadata = {
            packetId: manifest.packetId,
            packetPath: approvedPath,
            packetSha256: sha256Bytes(approved),
            decidedAt,
            decisionCount: decisions.cards.length
          };
          await fs.writeFile("authoring/.build/intuition-calibration-r1/approval-metadata.json", `${JSON.stringify(metadata, null, 2)}\n`);
          console.log(JSON.stringify(metadata, null, 2));
          NODE
      - name: Reconcile the exact approved packet without the pre-update package gate
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { projectRoot } from "./src/core/config.mjs";
          import { reconcileApprovedProposal } from "./src/authoring/reconcile.mjs";
          const metadata = JSON.parse(await fs.readFile("authoring/.build/intuition-calibration-r1/approval-metadata.json", "utf8"));
          const result = await reconcileApprovedProposal({
            root: projectRoot,
            id: "intuition-calibration-r1",
            packetId: metadata.packetId,
            packetPath: metadata.packetPath,
            packetSha256: metadata.packetSha256,
            branchName: "task/intuition-calibration-20260902",
            runCompleteGates: false
          });
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Add permanent reconciled-proposal regression coverage and update inventories
        run: |
          cat > tests/intuition-calibration-proposal.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs/promises";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { compileGuideGraphs } from "../src/guide-graph/compiler.mjs";
          import { runGraphRegressionSuite } from "../src/guide-graph/regressions.mjs";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const proposalRoot = path.join(root, "authoring", "obsidian", "proposals", "intuition-calibration-r1");

          function nodeById(bundle, id) {
            return bundle.graphs.flatMap((graph) => graph.nodes).find((node) => node.id === id);
          }

          function hasNoneGate(node, field, value) {
            return (node.activation.none ?? []).some((condition) => condition.field === field && condition.op === "eq" && condition.value === value);
          }

          test("reconciled intuition-calibration authority preserves all proposal regressions and safety distinctions", async () => {
            const proposal = await fs.readFile(path.join(proposalRoot, "proposal.md"), "utf8");
            assert.match(proposal, /^status: reconciled$/m);

            const bundle = await compileGuideGraphs({ root, write: false });
            const caseFiles = Array.from({ length: 8 }, (_, index) => `G${String(index + 25).padStart(3, "0")}.json`);
            const cases = await Promise.all(caseFiles.map(async (file) => JSON.parse(await fs.readFile(path.join(proposalRoot, "tests", file), "utf8"))));
            const regressions = await runGraphRegressionSuite({ root, bundle, cases });
            assert.equal(regressions.ok, true, JSON.stringify(regressions.results.filter((item) => !item.ok), null, 2));
            assert.equal(regressions.count, 8);

            const selfDeath = nodeById(bundle, "IC.SUICIDAL_SELF_DEATH_INQUIRY");
            const precious = nodeById(bundle, "IC.PRECIOUS_HUMAN_OPPORTUNITY");
            for (const node of [selfDeath, precious]) {
              assert.ok(node);
              assert.ok(hasNoneGate(node, "present_safety", "unsafe"));
              assert.ok(hasNoneGate(node, "orientation", "disoriented"));
              assert.ok(hasNoneGate(node, "ability_to_stop", "no"));
              assert.ok(hasNoneGate(node, "ability_to_return", "no"));
              assert.ok(hasNoneGate(node, "altered_state", "altered"));
            }
            assert.equal(selfDeath.tier, 1);
            assert.equal(selfDeath.priority, 99);
            assert.equal(precious.tier, 1);
            assert.equal(precious.priority, 98);
            assert.ok(selfDeath.recommendations.some((item) => /precious-human-opportunity/i.test(item)));
            assert.ok(precious.effects.requiredNuance.some((item) => /regardless of prior spiritual curiosity/i.test(item)));
            assert.ok(precious.effects.requiredNuance.some((item) => /hellish states/i.test(item)));

            const calibration = nodeById(bundle, "IC.INTUITION_TRUST_CALIBRATION");
            assert.ok(calibration);
            assert.equal(calibration.tier, 2);
            assert.equal(calibration.priority, 100);
            assert.ok(calibration.effects.requiredNuance.some((item) => /Neither receives unilateral control/i.test(item)));
            assert.ok(calibration.effects.requiredNuance.some((item) => /Separate the raw signal/i.test(item)));
            assert.ok(calibration.effects.forbiddenOverclaims.some((item) => /strong intuitive click proves/i.test(item)));
            assert.ok(calibration.avoid.some((item) => /simplistic left-brain\/right-brain anatomy claim/i.test(item)));

            const semanticAssets = bundle.sourceMaps.find((item) => item.guideId === "semantic-assets");
            assert.ok(semanticAssets);
            assert.ok(semanticAssets.sections.some((item) => item.id === "ASSET.IC.SUICIDE.COSMIC_JACKPOT"));
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/authoring-projection.test.mjs'): [
                  ('assert.equal(keys.filter((item) => item.includes("/nodes/")).length, 39);', 'assert.equal(keys.filter((item) => item.includes("/nodes/")).length, 41);'),
                  ('assert.equal(keys.filter((item) => item.includes("/edges/")).length, 35);', 'assert.equal(keys.filter((item) => item.includes("/edges/")).length, 40);'),
              ],
              Path('tests/guide-graph.test.mjs'): [
                  ('assert.equal(bundle.stats.nodeCount, 39);', 'assert.equal(bundle.stats.nodeCount, 41);'),
                  ('assert.equal(bundle.stats.edgeCount, 35);', 'assert.equal(bundle.stats.edgeCount, 40);'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing inventory anchor in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Regenerate canonical projections and document the approval receipt
        run: |
          npm run graph:compile
          npm run authoring:project
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('authoring/.build/intuition-calibration-r1/approval-metadata.json').read_text())
          text = (
              "# Intuition calibration reconciliation\n\n"
              "Owner-approved and reconciled proposal `intuition-calibration-r1`.\n\n"
              "The canonical directed graph now includes the precious-human-opportunity suicide reality check, "
              "intuition/analytic trust calibration, smart external-authority safeguards, and semantic provenance "
              "for instructional guide images.\n\n"
              f"Owner approval was recorded across {metadata['decisionCount']} exact decision cards after an "
              "independent GPT-5.6 Pro pass found no blockers. "
              f"Approved packet: `{metadata['packetId']}`; SHA-256: `{metadata['packetSha256']}`; "
              f"decided at `{metadata['decidedAt']}`.\n\n"
              "Reconciliation remained on the task branch until the complete repository verification and "
              "pull-request checks passed.\n"
          )
          Path('docs/INTUITION-CALIBRATION-CANDIDATE.md').write_text(text)
          PY
      - name: Remove this one-shot workflow before final verification
        run: git rm .github/workflows/tmp-approve-reconcile-intuition.yml
      - name: Run complete post-reconciliation verification
        run: npm run verify
      - name: Commit and push the reconciled authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git ls-files 'authoring/.build/**')"
          git commit -m "proposal: reconcile approved intuition calibration"
          git push origin HEAD:task/intuition-calibration-20260902
