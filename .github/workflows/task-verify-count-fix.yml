name: One-shot reconciled graph count fix

on:
  push:
    branches:
      - task/love-horizon-map-20260901

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/love-horizon-map-20260901
          fetch-depth: 0
          persist-credentials: true
      - name: Update reconciled graph inventory assertion and self-remove
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/nodeCount !== 33/nodeCount !== 39/' scripts/verify-package.sh
          rm .github/workflows/task-verify-count-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-package.sh .github/workflows/task-verify-count-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: update fake autopilot graph inventory'
          git push origin HEAD:task/love-horizon-map-20260901
