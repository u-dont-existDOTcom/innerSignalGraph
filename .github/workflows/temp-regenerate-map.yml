name: Temporary therapy map regeneration

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-therapy-map-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate therapy map
        run: |
          npm run graph:compile
          npm run authoring:maps

      - name: Commit generated therapy map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INNER-CHILD-THERAPY-MAP.md
          if git diff --cached --quiet; then
            echo "Therapy map already current."
            exit 0
          fi
          git commit -m "chore(authoring): regenerate therapy map document"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
