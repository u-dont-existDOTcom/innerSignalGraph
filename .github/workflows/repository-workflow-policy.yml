name: Repository workflow policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enforce workflow security baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import re
          import sys
          from pathlib import Path

          errors = []
          uses_pattern = re.compile(r"(?m)^\s*-?\s*uses:\s*[\"']?([^@\s\"']+)@([^\s#\"']+)")
          full_sha = re.compile(r"^[0-9a-fA-F]{40}$")
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              if not re.search(r"(?m)^permissions\s*:", text):
                  errors.append((path, "missing explicit top-level permissions"))
              if re.search(r"(?m)^\s*permissions\s*:\s*write-all\s*(?:#.*)?$", text):
                  errors.append((path, "permissions: write-all is forbidden"))
              if "pull_request_target" in text and re.search(r"(?m)^\s*-?\s*uses:\s*[\"']?actions/checkout@", text):
                  errors.append((path, "pull_request_target must not check out or execute untrusted pull-request code"))
              for action, ref in uses_pattern.findall(text):
                  if action.startswith("./") or action.startswith("docker://"):
                      continue
                  if not full_sha.fullmatch(ref):
                      errors.append((path, f"remote dependency {action}@{ref} is not pinned to a full commit SHA"))
          for path, message in errors:
              print(f"::error file={path}::{message}")
          if errors:
              print(f"workflow policy failed with {len(errors)} finding(s)")
              sys.exit(1)
          print("workflow policy passed")
          PY
