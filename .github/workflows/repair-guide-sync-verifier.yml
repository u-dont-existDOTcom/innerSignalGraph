name: Repair guide-sync verifier

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916
    paths:
      - '.github/workflows/repair-guide-sync-verifier.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
          fetch-depth: 0
      - name: Replace exact stale graph inventory assertion
        shell: bash
        run: |
          set -euo pipefail
          old='if (latest.details?.graphBundle?.stats?.nodeCount !== 62) throw new Error("Fake autopilot did not record the compiled graph bundle.");'
          new='if (latest.details?.graphBundle?.stats?.nodeCount !== 71) throw new Error("Fake autopilot did not record the compiled graph bundle.");'
          test "$(grep -Fxc "$old" scripts/verify-package.sh)" = 1
          sed -i "s/nodeCount !== 62/nodeCount !== 71/" scripts/verify-package.sh
          test "$(grep -Fxc "$new" scripts/verify-package.sh)" = 1
          ! grep -Fq 'nodeCount !== 62' scripts/verify-package.sh
          rm -f .github/workflows/repair-guide-sync-verifier.yml
          git diff --check
      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[guide-sync-verifier-repaired] Update compiled graph inventory assertion'
          git push origin HEAD:task/somatic-altered-guide-sync-20260916
