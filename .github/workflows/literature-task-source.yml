name: Literature task source snapshot

on:
  push:
    branches: [companion/foundations-2026-09-05]
    paths: [.github/workflows/literature-task-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same reviewed pin as Verify
        with:
          ref: 77bd76e2b8a5252dedfcaa502673dd877b1336ae
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, same reviewed pin as Verify
        with:
          node-version-file: .nvmrc
      - name: Prepare exact public source and offline verification dependencies
        run: |
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/literature-task"
          git archive --format=zip --output="$RUNNER_TEMP/literature-task/baseline-source.zip" HEAD
          git bundle create "$RUNNER_TEMP/literature-task/public-source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/literature-task/COMMIT.txt"
          tar -czf "$RUNNER_TEMP/literature-task/dependencies.tgz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/literature-task/node"
          sha256sum "$RUNNER_TEMP/literature-task/"* > "$RUNNER_TEMP/literature-task/SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official tag resolved for this task
        with:
          name: literature-task-offline-verification
          path: ${{ runner.temp }}/literature-task/
          retention-days: 1
          if-no-files-found: error
