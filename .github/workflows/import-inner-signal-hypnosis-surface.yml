name: Import Inner Signal hypnosis surface

on:
  push:
    branches: [task/inner-signal-hypnosis-guide-map-20260911]
    paths:
      - tasks/inner-signal-hypnosis-guide-map-20260911/import-request.json

permissions:
  contents: write

concurrency:
  group: inner-signal-hypnosis-surface-import
  cancel-in-progress: false

jobs:
  import:
    if: github.actor == 'u-dont-existDOTcom'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/inner-signal-hypnosis-guide-map-20260911
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Reconstruct and verify exact data package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, stat, urllib.request, zipfile, io

          root = pathlib.Path('.')
          req_path = root / 'tasks/inner-signal-hypnosis-guide-map-20260911/import-request.json'
          req = json.loads(req_path.read_text(encoding='utf-8'))
          assert req['format'] == 'inner-signal-hypnosis-surface-import-v1'
          assert req['branch'] == 'task/inner-signal-hypnosis-guide-map-20260911'
          expected_paths = set(req['files'])
          allowed = {
              'guide-graphs/candidates/inner-signal-hypnosis.graph.json',
              'guide-graphs/source-maps/inner-signal-hypnosis-guide.json',
              'docs/INNER-SIGNAL-HYPNOSIS-MAP.md',
              'scripts/generate-guide-surface-map.mjs',
              'tests/inner-signal-hypnosis-surface.test.mjs',
              'tasks/inner-signal-hypnosis-guide-map-20260911/README.md',
          }
          assert expected_paths == allowed
          raw_parts = []
          for part in req['chunks']:
              sha = part['git_blob_sha']
              api = f'https://api.github.com/repos/u-dont-existDOTcom/innerSignalGraph/git/blobs/{sha}'
              request = urllib.request.Request(api, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              payload = json.load(urllib.request.urlopen(request, timeout=30))
              assert payload['sha'] == sha and payload['encoding'] == 'base64'
              stored_text = base64.b64decode(payload['content']).decode('utf-8')
              raw_parts.append(base64.b64decode(stored_text, validate=True))
          archive = b''.join(raw_parts)
          assert len(archive) == req['archive_size']
          assert hashlib.sha256(archive).hexdigest() == req['archive_sha256']

          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names = z.namelist()
              assert len(names) == len(set(names))
              assert set(names) == expected_paths
              for name in names:
                  pure = pathlib.PurePosixPath(name)
                  assert not pure.is_absolute() and '..' not in pure.parts and '\\' not in name
                  mode = z.getinfo(name).external_attr >> 16
                  assert not stat.S_ISLNK(mode)
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == req['files'][name]
                  target = root / name
                  assert not target.is_symlink()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          receipt = {
              'format': 'inner-signal-hypnosis-surface-import-receipt-v1',
              'base_main_sha': req['base_main_sha'],
              'canonical_article': req['canonical_article'],
              'archive_sha256': req['archive_sha256'],
              'archive_size': req['archive_size'],
              'chunk_blob_shas': [x['git_blob_sha'] for x in req['chunks']],
              'imported_files': req['files'],
              'production_graph_changed': False,
              'compiled_inner_child_somatic_bundle_changed': False,
              'verification': [
                  'node --test tests/inner-signal-hypnosis-surface.test.mjs',
                  'npm run audit:repository',
                  'npm run verify',
                  'git diff --check',
              ],
          }
          out = root / 'tasks/inner-signal-hypnosis-guide-map-20260911/IMPORT-RECEIPT.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Reconstructed and verified', len(names), 'files')
          PY

      - name: Remove temporary import transport from final tree
        run: |
          rm -f .github/workflows/import-inner-signal-hypnosis-surface.yml
          rm -f tasks/inner-signal-hypnosis-guide-map-20260911/import-request.json

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Run targeted surface regression
        run: node --test tests/inner-signal-hypnosis-surface.test.mjs

      - name: Audit repository policy
        run: npm run audit:repository

      - name: Run deterministic package gate
        run: npm run verify

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified surface artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- \
            .github/workflows/import-inner-signal-hypnosis-surface.yml \
            guide-graphs/candidates/inner-signal-hypnosis.graph.json \
            guide-graphs/source-maps/inner-signal-hypnosis-guide.json \
            docs/INNER-SIGNAL-HYPNOSIS-MAP.md \
            scripts/generate-guide-surface-map.mjs \
            tests/inner-signal-hypnosis-surface.test.mjs \
            tasks/inner-signal-hypnosis-guide-map-20260911
          git diff --cached --check
          git commit -m 'Add Inner Signal hypnosis guide graph surface'
          git push origin HEAD:task/inner-signal-hypnosis-guide-map-20260911
