name: Temporary somatic altered closeout

on:
  push:
    branches:
      - task/somatic-altered-guide-closeout-20260916
    paths:
      - tasks/somatic-altered-guide-sync-20260916/CLOSEOUT-TRIGGER

permissions:
  contents: write

concurrency:
  group: tmp-somatic-altered-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-closeout-20260916
          fetch-depth: 0

      - name: Set up repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Apply terminal bookkeeping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          closeout = "2026-09-16T21:56:12Z"

          p = Path("tasks/ACTIVE-TASK.json")
          d = json.loads(p.read_text())
          assert d["taskId"] == "somatic-altered-guide-sync-20260916"
          assert d["status"] == "in_progress"
          d["status"] = "complete"
          d["completionClaimRule"] = "Report the exact achieved state: all 31 exact Guide Packet decision cards are owner-approved, reconciled, and merged to development main; stable promotion, installation and deployment remain separate and unauthorized."
          d["terminal"] = {
            "mergedHead": "e48c183a725c9d894a6f401f87ae6bea181068cc",
            "mergeCommit": "0e132aa8b3826ff5cd57b70e07bd2591543087a2",
            "mergedAt": "2026-09-16T21:50:57Z",
            "closeoutRecordedAt": closeout,
            "closeoutBasis": "GitHub readback confirms PR 67 merged after exact-head protected checks; the verified review tree matches the merged development-main tree."
          }
          p.write_text(json.dumps(d, indent=2) + "\n")

          p = Path("tasks/somatic-altered-guide-sync-20260916/INTEGRATION.md")
          s = p.read_text()
          old = "Status: OWNER_APPROVED_AND_RECONCILED; merge pending; not installed, deployed, or promoted to `stable`."
          assert s.count(old) == 1
          s = s.replace(old, "Status: COMPLETE; owner-approved reconciliation merged to development `main`; not installed, deployed, or promoted to `stable`.")
          old = "- Merge into development `main` is authorized once the final clean exact head passes the protected repository checks. Installation, deployment, and `stable` promotion remain explicitly unauthorized."
          assert s.count(old) == 1
          s = s.replace(old, "- Merge into development `main` completed after the final clean exact head passed the protected repository checks. Installation, deployment, and `stable` promotion remain explicitly unauthorized.")
          old = "- Owner semantic approval and Guide Packet reconciliation are complete for this exact 31-card change. The remaining gate is exact-head protected CI and merge into development `main`."
          assert s.count(old) == 1
          s = s.replace(old, "- Owner semantic approval, Guide Packet reconciliation, exact-head protected CI, and merge into development `main` are complete for this exact 31-card change.")
          s += f"""

          ## Terminal merge closeout — 2026-09-16

          - Verified review head: `e48c183a725c9d894a6f401f87ae6bea181068cc`.
          - Squash merge to development `main`: `0e132aa8b3826ff5cd57b70e07bd2591543087a2` at `2026-09-16T21:50:57Z`.
          - Verified review tree and merged tree are identical: `e3e86a0fbfa136dfed7924a9690713bfa8553630`.
          - Required protected checks on the exact review head: deterministic-package PASS, workflow-policy PASS, codeql-javascript PASS.
          - The newer protocol-state provenance work already on `main` was preserved during base reconciliation; canonical approved graph files and approval/reconciliation receipts did not drift.
          - `stable` remains `d74ae8b02d11b7edc72c70a753f6d93cf61e93b5`; installation, deployment, release, and stable promotion were not performed.
          - Closeout recorded at `{closeout}`.
          """
          p.write_text(s)

          p = Path("state/CODEX-CURRENT-STATE.md")
          s = p.read_text()
          old = "## Somatic + altered-states guide sync — owner approved and reconciled"
          assert s.count(old) == 1
          s = s.replace(old, "## Somatic + altered-states guide sync — owner approved, reconciled, and merged")
          old = "The reconciliation reports `installed=false` and `stableChanged=false`. The exact reconciled task branch must pass the protected hosted checks before merge to development `main`. Installation, deployment and `stable` promotion remain separate and unauthorized. Exact packet, approval and reconciliation hashes/receipts are in `tasks/somatic-altered-guide-sync-20260916/`."
          assert s.count(old) == 1
          s = s.replace(old, "The reconciliation reports `installed=false` and `stableChanged=false`. The exact reconciled review head passed deterministic-package, workflow-policy, and CodeQL; PR #67 was squash-merged to development `main` as `0e132aa8b3826ff5cd57b70e07bd2591543087a2`, and the verified review tree exactly matches the merged tree. Installation, deployment and `stable` promotion remain separate and unauthorized. Exact packet, approval, reconciliation, and closeout receipts are in `tasks/somatic-altered-guide-sync-20260916/`.")
          p.write_text(s)

          receipt = {
            "schemaVersion": 1,
            "receiptId": "somatic-altered-guide-sync-20260916-closeout-20260916",
            "taskId": "somatic-altered-guide-sync-20260916",
            "status": "COMPLETE",
            "pullRequest": 67,
            "reviewedHead": "e48c183a725c9d894a6f401f87ae6bea181068cc",
            "squashMergeCommit": "0e132aa8b3826ff5cd57b70e07bd2591543087a2",
            "sourceTree": "e3e86a0fbfa136dfed7924a9690713bfa8553630",
            "mergedTree": "e3e86a0fbfa136dfed7924a9690713bfa8553630",
            "treeMatch": True,
            "mergedAt": "2026-09-16T21:50:57Z",
            "closeoutRecordedAt": closeout,
            "requiredChecks": [
              {"workflow": "Verify", "name": "deterministic-package", "conclusion": "SUCCESS", "completedAt": "2026-09-16T21:48:58Z"},
              {"workflow": "Repository workflow policy", "name": "workflow-policy", "conclusion": "SUCCESS", "completedAt": "2026-09-16T21:47:55Z"},
              {"workflow": "CodeQL", "name": "codeql-javascript", "conclusion": "SUCCESS", "completedAt": "2026-09-16T21:49:11Z"}
            ],
            "stable": {
              "remoteRefBeforeCloseout": "d74ae8b02d11b7edc72c70a753f6d93cf61e93b5",
              "remoteRefAfterCloseout": "d74ae8b02d11b7edc72c70a753f6d93cf61e93b5",
              "changed": False
            },
            "taskWasExclusive": False,
            "rootTaskTerminalized": True,
            "rootLockPath": "tasks/ACTIVE-TASK.json",
            "checkpointPath": "state/CODEX-CURRENT-STATE.md",
            "integrationPath": "tasks/somatic-altered-guide-sync-20260916/INTEGRATION.md"
          }
          Path("tasks/somatic-altered-guide-sync-20260916/CLOSEOUT-RECEIPT.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

          python3 -m json.tool tasks/ACTIVE-TASK.json >/dev/null
          python3 -m json.tool tasks/somatic-altered-guide-sync-20260916/CLOSEOUT-RECEIPT.json >/dev/null
          git diff --check
          npm ci --ignore-scripts
          npm run audit:repository
          node --test tests/authoring-task-closeout.test.mjs

      - name: Commit terminal bookkeeping
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/CODEX-CURRENT-STATE.md tasks/ACTIVE-TASK.json tasks/somatic-altered-guide-sync-20260916/INTEGRATION.md tasks/somatic-altered-guide-sync-20260916/CLOSEOUT-RECEIPT.json
          git diff --cached --check
          git commit -m "Close out somatic altered guide integration"
          git push origin HEAD:task/somatic-altered-guide-closeout-20260916
