name: Love horizon candidate generator

on:
  push:
    branches: [task/love-horizon-map-20260901]

permissions:
  contents: write

concurrency:
  group: love-horizon-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/love-horizon-map-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Prepare conservative case fields and owner amendments
        run: node scripts/tmp-love-horizon-proposal.mjs prepare

      - name: Regenerate canonical deterministic projections
        run: |
          npm run graph:compile
          npm run authoring:project

      - name: Create governed candidate proposal
        run: |
          node scripts/tmp-love-horizon-proposal.mjs proposal
          npm run authoring:proposal:build -- --id love-horizon-r1
          npm run authoring:proposal:check -- --id love-horizon-r1

      - name: Validate candidate and unchanged current graph
        run: |
          npm run authoring:validate
          npm run authoring:maps:check
          npm run graph:test

      - name: Preserve review artifacts
        run: |
          mkdir -p docs/audits
          cp authoring/.build/love-horizon-r1/maps/candidate-map.md docs/INNER-CHILD-LOVE-HORIZON-CANDIDATE-MAP-2026-09-01.md
          cp authoring/.build/love-horizon-r1/audit/behavioral-diff.json docs/audits/2026-09-01-love-horizon-behavioral-diff.json
          cp authoring/.build/love-horizon-r1/audit/owner-decisions.json docs/audits/2026-09-01-love-horizon-owner-decisions.json
          cp authoring/.build/love-horizon-r1/audit/regression-impact.json docs/audits/2026-09-01-love-horizon-regression-impact.json
          cp authoring/.build/love-horizon-r1/audit/provenance-impact.json docs/audits/2026-09-01-love-horizon-provenance-impact.json
          cp authoring/.build/love-horizon-r1/candidate/graphs/inner-child.graph.json docs/audits/2026-09-01-love-horizon-inner-child-candidate.json
          cp authoring/.build/love-horizon-r1/receipt.json docs/audits/2026-09-01-love-horizon-receipt.json

      - name: Remove one-shot generator
        run: |
          rm scripts/tmp-love-horizon-proposal.mjs
          rm .github/workflows/task-love-horizon-generate.yml

      - name: Commit deterministic candidate
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: propose love-horizon inner-child routing"
          git push origin HEAD:task/love-horizon-map-20260901
