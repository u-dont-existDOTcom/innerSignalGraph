name: Verify

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: deterministic-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Generate, restore normal workflow, and commit canonical projection
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          test -n "$TARGET_BRANCH"
          npm run authoring:project
          git show 85293856fee53a477cb5f6ba39c761962822ba7e:.github/workflows/verify.yml > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/obsidian/current docs/INNER-CHILD-THERAPY-MAP.md .github/workflows/verify.yml
          git diff --cached --quiet && { echo "Expected generated projection changes were not produced."; exit 1; }
          git commit -m "Refresh authoring projection after path semantics change"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Run deterministic package gate on committed generated tree
        run: npm run verify

      - name: Report final worktree
        run: bash scripts/report-worktree.sh

      - name: Require clean final worktree
        run: test -z "$(git status --porcelain)"
