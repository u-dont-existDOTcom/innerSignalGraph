name: Verify

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: deterministic-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit repository policy
        run: npm run audit:repository

      - name: Run deterministic package gate
        run: npm run verify

      - name: Report final worktree
        run: bash scripts/report-worktree.sh

      - name: Require clean final worktree
        run: test -z "$(git status --porcelain)"
