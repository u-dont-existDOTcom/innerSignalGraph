name: Verify

on:
  pull_request:
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: deterministic-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Bootstrap locked runtime dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run stable package verifier
        run: npm run verify

      - name: Verify exact reviewed InnerSignal plugin blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local expected="$1" path="$2"
            test "$(git hash-object "$path")" = "$expected"
          }
          check_blob f23f93f9048f82c40b78f0cd6a2207f80f30f09d plugins/inner-signal-therapy/.codex-plugin/plugin.json
          check_blob e0cb90e69a157d2a6cd10484ff103abbae4381ad plugins/inner-signal-therapy/skills/inner-signal-private-continuity/SKILL.md
          check_blob b36d367581b620fc0514eb3d5832656deda9189e plugins/inner-signal-therapy/skills/inner-signal-therapy/SKILL.md
          check_blob f0b0ebe379f4f9aa2358ec1733011c40b744b121 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/FOCUS-DISCIPLINE.md
          check_blob bac0b5bd57f49376ebe8f994e89240d60e5fda2e plugins/inner-signal-therapy/skills/inner-signal-therapy/references/GUIDE-REFERRALS.md
          check_blob 63362f82112c2a6db9993330af46aefb61bc8531 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/INNER-CHILD-BOX-GUIDANCE.md
          check_blob 7cf8f4fdf99479a33aaa2bee8cb3afdc5791873d plugins/inner-signal-therapy/skills/inner-signal-therapy/references/INNER-CHILD-THERAPY-MAP.md
          check_blob 6d227f7b35359c81201c48d7fbc3a1e28c298e69 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/LONGITUDINAL-SYNTHESIS.md
          check_blob 15ff0a1fc1f74067c4b8353baf999da14a636ee3 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/PHENOMENOLOGY-AND-REPRESENTATION.md
          check_blob 09c25273298a7b3967eafa6aa8052c90bf8e59c4 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/PROTECTIVE-COMPATIBILITY.md
          check_blob 077bd32f292683f8dfdfb0b599aa91d0d1f1353d plugins/inner-signal-therapy/skills/inner-signal-therapy/references/PROTOCOL-STATE-PROVENANCE.md
          check_blob 58fe2970947a2bf35f735827245d07c7589b9ed3 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/RESPONSE-FIDELITY.md
          check_blob 01b3cf1f6f7640e0e065b78988e9dd4933d2df33 plugins/inner-signal-therapy/skills/inner-signal-therapy/references/ROLE-BELIEF-INTEGRITY.md
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('plugins/inner-signal-therapy/.codex-plugin/plugin.json', 'utf8'));
          if (m.version !== '0.2.6' || m.interface?.displayName !== 'InnerSignal') throw new Error('Wrong InnerSignal release manifest.');
          if (!m.interface?.capabilities?.includes('Advisory') || !m.interface?.capabilities?.includes('Read')) throw new Error('Unified capabilities missing.');
          NODE
