name: Verify

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: deterministic-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit repository policy
        run: npm run audit:repository

      - name: Generate canonical authoring projection artifact
        run: |
          npm run authoring:project
          tar -czf /tmp/reparenting-authoring-projection.tar.gz authoring/obsidian/current docs/INNER-CHILD-THERAPY-MAP.md

      - name: Upload canonical authoring projection artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reparenting-authoring-projection
          path: /tmp/reparenting-authoring-projection.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Restore generated projection before normal verification
        run: git restore authoring/obsidian/current docs/INNER-CHILD-THERAPY-MAP.md

      - name: Run deterministic package gate
        run: npm run verify

      - name: Report final worktree
        run: bash scripts/report-worktree.sh

      - name: Require clean final worktree
        run: test -z "$(git status --porcelain)"
