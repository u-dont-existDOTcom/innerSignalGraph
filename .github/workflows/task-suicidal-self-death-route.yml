name: Suicidal self-death route rebase

on:
  push:
    branches: [task/love-horizon-map-20260901]

permissions:
  contents: write

concurrency:
  group: suicidal-self-death-route-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/love-horizon-map-20260901
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts
      - name: Apply owner-approved source and runtime contract update
        run: node scripts/tmp-suicidal-self-death-route.mjs prepare
      - name: Regenerate deterministic current projections
        run: |
          npm run graph:compile
          npm run authoring:project
      - name: Rebind and extend governed proposal
        run: |
          node scripts/tmp-suicidal-self-death-route.mjs proposal
          node scripts/tmp-rebind-love-horizon-edges.mjs
      - name: Diagnose exact proposal regression
        run: |
          node --input-type=module - <<'NODE'
          import { materializeProposal } from './src/authoring/proposal-builder.mjs';
          try {
            await materializeProposal({ root: process.cwd(), id: 'love-horizon-r1', enforceCoverage: false });
          } catch (error) {
            console.error(JSON.stringify({ code: error.code, message: error.message, details: error.details ?? null }, null, 2));
            process.exit(1);
          }
          NODE
      - name: Build and verify exact proposal
        run: |
          npm run authoring:proposal:build -- --id love-horizon-r1
          npm run authoring:proposal:check -- --id love-horizon-r1
          node --test tests/love-horizon-proposal.test.mjs
          npm run authoring:validate
          npm run authoring:check
          npm run authoring:maps:check
      - name: Run complete package gate
        run: npm run verify
      - name: Remove one-shot generator
        run: rm -f scripts/tmp-suicidal-self-death-route.mjs scripts/tmp-rebind-love-horizon-edges.mjs .github/workflows/task-suicidal-self-death-route.yml
      - name: Commit governed candidate update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add strict suicidal self-death inquiry route'
          git push origin HEAD:task/love-horizon-map-20260901
