name: Diagnose owner packet regression expectations

on:
  push:
    branches:
      - task/somatic-altered-guide-sync-20260916

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/somatic-altered-guide-sync-20260916
      - name: Set up repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false
      - name: Bootstrap exact dependencies
        run: npm ci --ignore-scripts
      - name: Evaluate proposed packet cases against exact candidate
        run: |
          node --input-type=module <<'NODE'
          import { compileGuideGraphs } from './src/guide-graph/compiler.mjs';
          import { blankCaseVariables } from './src/guide-graph/contract.mjs';
          import { runGraphRegressionSuite } from './src/guide-graph/regressions.mjs';
          const bundle = await compileGuideGraphs({ write: false });
          const safe = {
            ...blankCaseVariables(), present_safety:'safe', orientation:'oriented', ability_to_stop:'yes', ability_to_return:'yes',
            activation:'moderate', dissociation:'none', altered_state:'sober', suicidal_state:'absent', inner_adult_access:'available',
            support_available:'present', body_capacity:'adequate', current_intent:'conversation', actionable_problem:'absent',
            unresolved_inner_material:'absent', attention_loop:'absent', inward_attention_effect:'neutral', other_person_central:'no',
            influence_domain:'none', memory_source_risk:'absent'
          };
          const cases = [
            {id:'G037',description:'SIBAM',variables:{...safe,current_intent:'gentle_practice',unresolved_inner_material:'present'},unknowns:[],expected:{selectedIncludes:['SOM.SIBAM_TRACKING'],requiredNuancePatterns:['attention map','greater truth value'],forbiddenOverclaimPatterns:['nonverbal, somatic, earlier, intuitive, or intense material']}},
            {id:'G038',description:'Meaning',variables:{...safe,current_intent:'integration'},unknowns:[],expected:{selectedIncludes:['SOM.MEANING_INTEGRATION'],requiredNuancePatterns:['nonverbal is not deeper or truer']}},
            {id:'G039',description:'Touch',variables:{...safe,touch_interest:'present'},unknowns:[],expected:{selectedIncludes:['SOM.CONSENSUAL_TOUCH']}},
            {id:'G040',description:'Aquatic',variables:{...safe,aquatic_bodywork_interest:'present'},unknowns:[],expected:{selectedIncludes:['SOM.AQUATIC_BODYWORK']}},
            {id:'G041',description:'Medical',variables:{...safe,altered_state:'altered',altered_capacity:'impaired',altered_medical_status:'concerning',activation:'high',unresolved_inner_material:'present'},unknowns:[],expected:{primary:'ROUTE.ALTERED_MEDICAL_SAFETY',selectedIncludes:['ROUTE.ALTERED_MEDICAL_SAFETY'],blockedIncludes:['ROUTE.GO_INWARD','ROUTE.ALTERED_STABLE_THERAPY'],deferredIncludes:['IC.DEEP_CHILD_DIALOGUE','SOM.DEEP_BRAINSPOTTING','SOM.EMDR_DISCRETE','SOM.EMDR_DEVELOPMENTAL']}},
            {id:'G042',description:'Acute',variables:{...safe,altered_state:'altered',altered_capacity:'limited',altered_medical_status:'stable',activation:'high',unresolved_inner_material:'present'},unknowns:[],expected:{primary:'ROUTE.ALTERED_ACUTE_STABILIZATION',selectedIncludes:['ROUTE.ALTERED_ACUTE_STABILIZATION'],blockedIncludes:['ROUTE.GO_INWARD','ROUTE.ALTERED_STABLE_THERAPY'],deferredIncludes:['IC.DEEP_CHILD_DIALOGUE','SOM.DEEP_BRAINSPOTTING','SOM.EMDR_DISCRETE','SOM.EMDR_DEVELOPMENTAL']}},
            {id:'G043',description:'Stable',variables:{...safe,altered_state:'altered',altered_capacity:'coherent',altered_medical_status:'stable',activation:'low',current_intent:'deep_dialogue',deep_work_readiness:'yes',unresolved_inner_material:'present'},unknowns:[],expected:{selectedIncludes:['ROUTE.ALTERED_STABLE_THERAPY','IC.ALTERED_STATE_GATE','IC.DEEP_CHILD_DIALOGUE'],requiredNuancePatterns:['lack of habitual inner speech','articulate writing']}},
            {id:'G044',description:'Action lock',variables:{...safe,altered_state:'altered',altered_capacity:'coherent',altered_medical_status:'stable',activation:'low',altered_action_pressure:'present',altered_phase:'aftermath'},unknowns:[],expected:{primary:'ROUTE.ALTERED_ACTION_LOCK',selectedIncludes:['ROUTE.ALTERED_ACTION_LOCK','ROUTE.ALTERED_AFTERMATH']}},
            {id:'G045',description:'Preparation',variables:{...safe,altered_phase:'planned',altered_state:'altered',altered_capacity:'coherent',altered_medical_status:'stable',activation:'low'},unknowns:[],expected:{selectedIncludes:['ROUTE.ALTERED_PREPARATION','ROUTE.ALTERED_STABLE_THERAPY']}},
            {id:'G046',description:'Aftermath',variables:{...safe,altered_phase:'aftermath',current_intent:'integration',unresolved_inner_material:'present'},unknowns:[],expected:{selectedIncludes:['ROUTE.ALTERED_AFTERMATH','SOM.MEANING_INTEGRATION','ROUTE.GO_INWARD']}}
          ];
          const result = await runGraphRegressionSuite({ bundle, cases });
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          NODE
