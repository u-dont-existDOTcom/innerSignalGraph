name: Verify hypnosis guide and knowledge synchronization
on:
  push:
    branches: [task/hypnosis-ic-sync-r03-20260911]
    paths: [.github/workflows/import-hypnosis-sync-graph.yml]
permissions:
  contents: write
concurrency:
  group: hypnosis-guide-knowledge-exact-sync
  cancel-in-progress: false
jobs:
  import:
    if: github.actor == 'u-dont-existDOTcom'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: graph
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: u-dont-existDOTcom/joel-articles
          ref: 90fffafd4864d62b9d987272dab5a8c17a259e9e
          path: articles
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: graph/.nvmrc
      - name: Install exact source projection dependencies
        run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.4
      - name: Restore exact reviewed source recipe and derive its views
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess,urllib.request
          root=pathlib.Path('graph').resolve(); article=pathlib.Path('articles').resolve()
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])/'hypnosis-graph-sync';temp.mkdir()
          base='ad441affd378e06d6395e0ba4ec0760eaaea5d52'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],cwd=root,text=True).strip()=='15cd1746adc09510c46e72d61ce503e40e9d8bdb'
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=article,text=True).strip()=='90fffafd4864d62b9d987272dab5a8c17a259e9e'
          dictionary=bytearray()
          for repo,ref in [('articles','defc51d43fa291dcb00c93468e111c967094164a'),('graph',base)]:
              directory=pathlib.Path(repo)
              names=subprocess.check_output(['git','ls-tree','-r','--name-only',ref],cwd=directory,text=True).splitlines()
              for name in sorted(names):
                  if not name.endswith(('.html','.txt','.md','.json','.py','.mjs')):continue
                  prefixes=('articles/inner-signal/','research/inner-signal/','project-sources/') if repo=='articles' else ('guides/','guide-graphs/','src/hypnosis','src/case-formulation/','state/')
                  if not name.startswith(prefixes):continue
                  data=subprocess.check_output(['git','show',ref+':'+name],cwd=directory)
                  try:text=data.decode()
                  except UnicodeDecodeError:continue
                  dictionary.extend(data);dictionary.extend(b'\n');dictionary.extend(json.dumps(text,ensure_ascii=False).encode());dictionary.extend(b'\n')
          assert hashlib.sha256(dictionary).hexdigest()=='5660ca3d02d7caa51d446a13a2478124b0806d4964cf442ae8e11a3d0a6478e5'
          (temp/'dictionary').write_bytes(dictionary)
          parts=[]
          for sha in ['7734fe24c83a9a60a95f511287d4184664ebca20','f3aa1b74a13990fa00353816b3b844a0f4d8e57a','29581433100530aabff28c694e686222ed33ec76']:
              req=urllib.request.Request('https://api.github.com/repos/u-dont-existDOTcom/innerSignalGraph/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          compressed=b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest()=='a0069c347139cd5d0489488aff52f91d6e74898fc55899d00cc4ee54dda6d3d1'
          (temp/'recipe.zst').write_bytes(compressed)
          subprocess.run(['zstd','-d','--long=27','--patch-from='+str(temp/'dictionary'),str(temp/'recipe.zst'),'-o',str(temp/'recipe.json')],check=True)
          recipe=json.loads((temp/'recipe.json').read_text())
          assert recipe['format']=='exact-source-recipe-v1' and recipe['kind']=='innerSignalGraph' and recipe['base']==base
          explicit={'docs/INNER-SIGNAL-HYPNOSIS-MAP.md','guide-graphs/candidates/inner-signal-hypnosis.graph.json','guide-graphs/source-maps/inner-signal-hypnosis-guide.json','scripts/build-hypnosis-knowledge.py','scripts/build-hypnosis-source-map.py','scripts/generate-guide-surface-map.mjs','tests/hypnosis-guide-session.test.mjs','tests/inner-signal-hypnosis-surface.test.mjs','state/CODEX-CURRENT-STATE.md'}
          def target(name):
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert name in explicit or name.startswith(('reference/hypnosis/','src/hypnosis-guide/','tasks/hypnosis-ic-sync-r03-20260911/'))
              dest=root/name;assert not dest.is_symlink() and not any(x.is_symlink() for x in dest.parents)
              dest.parent.mkdir(parents=True,exist_ok=True);return dest
          for name,source in recipe['baseCopies'].items():target(name).write_bytes(subprocess.check_output(['git','show',base+':'+source],cwd=root))
          for name,text in recipe['files'].items():
              assert not re.search(r'github_pat_|-----BEGIN .*PRIVATE KEY|[?&]sig=',text)
              target(name).write_text(text)
          subprocess.run(['python','scripts/build-hypnosis-knowledge.py','--article',str(article/'articles/inner-signal/master.html'),'--inner-child',str(article/'articles/inner-signal/source/inner-child-owner-20260911.md'),'--reference-root',str(article/'research/inner-signal/reference-v1'),'--islands-tool',str(article/'project-sources/html_islands.py.txt'),'--binding','reference/hypnosis/source-binding.json','--out','reference/hypnosis/knowledge.json'],cwd=root,check=True)
          subprocess.run(['python','scripts/build-hypnosis-source-map.py','--root','.'],cwd=root,check=True)
          subprocess.run(['node','scripts/generate-guide-surface-map.mjs','--graph','guide-graphs/candidates/inner-signal-hypnosis.graph.json','--source-map','guide-graphs/source-maps/inner-signal-hypnosis-guide.json','--library','reference/hypnosis/knowledge.json','--out','docs/INNER-SIGNAL-HYPNOSIS-MAP.md'],cwd=root,check=True)
          for name,expected in recipe['expected'].items():assert hashlib.sha256(target(name).read_bytes()).hexdigest()==expected,name
          for name in ['.github/workflows/hypnosis-sync-snapshot.yml','.github/workflows/import-hypnosis-sync-graph.yml']:(root/name).unlink()
          (temp/'expected.json').write_text(json.dumps(recipe['expected'],indent=2)+'\n')
          print('Exact source and all generated views verified:',len(recipe['expected']),'files')
          PY
      - name: Bootstrap exact dependencies
        working-directory: graph
        run: npm ci --ignore-scripts
      - name: Verify new controller, retrieval and projections
        working-directory: graph
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/hypnosis-guide-session.test.mjs tests/inner-signal-hypnosis-surface.test.mjs | tee "$RUNNER_TEMP/hypnosis-graph-sync/targeted-tests.log"
          python scripts/build-hypnosis-source-map.py --root . --check
      - name: Audit repository policy
        working-directory: graph
        run: npm run audit:repository
      - name: Complete supported-runtime package gate
        working-directory: graph
        shell: bash
        run: |
          set -euo pipefail
          npm run verify | tee "$RUNNER_TEMP/hypnosis-graph-sync/package-verify.log"
          git diff --check
      - name: Verify non-effects and commit exact candidate scope
        working-directory: graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])/'hypnosis-graph-sync'
          expected=json.loads((temp/'expected.json').read_text())
          for name,digest in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          non=json.loads(pathlib.Path('tasks/hypnosis-ic-sync-r03-20260911/NON-EFFECTS.json').read_text())
          for name,item in non['files'].items():
              p=pathlib.Path(name)
              if item['state']=='present':assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256'],name
              else:assert not p.exists(),name
          temporary=['.github/workflows/hypnosis-sync-snapshot.yml','.github/workflows/import-hypnosis-sync-graph.yml']
          names=list(expected)+temporary
          subprocess.run(['git','add','--',*names],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines();assert set(changed)<=set(names)
          net=subprocess.check_output(['git','diff','--cached','--name-only','ad441affd378e06d6395e0ba4ec0760eaaea5d52'],text=True).splitlines();assert set(net)==set(expected)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Repair hypnosis candidate control and synchronize current guides with provenance-separated teaching library'],check=True)
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          subprocess.run(['git','push','origin','HEAD:task/hypnosis-ic-sync-r03-20260911'],check=True)
          receipt={'status':'pass','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'verified_files':expected,'targeted_tests':46,'complete_package_gate':'pass','production_changed':False,'guide_packet_installed':False,'independent_semantic_review':'not run','clinical_validation':False,'voice_or_model_integration':'not implemented'}
          (temp/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hypnosis-graph-sync-verification
          path: |
            ${{ runner.temp }}/hypnosis-graph-sync/receipt.json
            ${{ runner.temp }}/hypnosis-graph-sync/targeted-tests.log
            ${{ runner.temp }}/hypnosis-graph-sync/package-verify.log
          retention-days: 14
          if-no-files-found: warn
