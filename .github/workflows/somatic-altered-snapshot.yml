name: Somatic altered-state public source snapshot

on:
  push:
    branches: [task/somatic-altered-guides-20260915]
    paths: [.github/workflows/somatic-altered-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Export only public Git source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inner-signal-source-export
          git bundle create /tmp/inner-signal-source-export/source.bundle HEAD refs/remotes/origin/main
          tar -czf /tmp/inner-signal-source-export/node-modules.tar.gz node_modules
          toolchain="$(dirname "$(dirname "$(command -v node)")")"
          tar -czf /tmp/inner-signal-source-export/node-toolchain.tar.gz -C "$toolchain" bin lib include share
          git rev-parse HEAD refs/remotes/origin/main > /tmp/inner-signal-source-export/refs.txt
          node --version > /tmp/inner-signal-source-export/node-version.txt
          (cd /tmp/inner-signal-source-export && sha256sum source.bundle node-modules.tar.gz node-toolchain.tar.gz > SHA256SUMS)
      - name: Upload public source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: somatic-altered-public-source
          path: /tmp/inner-signal-source-export/
          retention-days: 2
          if-no-files-found: error
