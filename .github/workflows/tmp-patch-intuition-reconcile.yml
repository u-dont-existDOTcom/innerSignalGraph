name: Temporary intuition reconciliation patcher

on:
  push:
    branches:
      - task/intuition-calibration-20260902
    paths:
      - .github/workflows/tmp-patch-intuition-reconcile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task/intuition-calibration-20260902
          fetch-depth: 0
      - name: Patch the remaining compiled graph inventory assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-approve-reconcile-intuition.yml')
          text = path.read_text()
          anchor = """              Path('tests/guide-graph.test.mjs'): [
                  ('assert.equal(bundle.stats.nodeCount, 39);', 'assert.equal(bundle.stats.nodeCount, 41);'),
                  ('assert.equal(bundle.stats.edgeCount, 35);', 'assert.equal(bundle.stats.edgeCount, 40);'),
              ],
          }
"""
          replacement = """              Path('tests/guide-graph.test.mjs'): [
                  ('assert.equal(bundle.stats.nodeCount, 39);', 'assert.equal(bundle.stats.nodeCount, 41);'),
                  ('assert.equal(bundle.stats.edgeCount, 35);', 'assert.equal(bundle.stats.edgeCount, 40);'),
              ],
              Path('scripts/verify-package.sh'): [
                  ('if (latest.details?.graphBundle?.stats?.nodeCount !== 39) throw new Error(\"Fake autopilot did not record the compiled graph bundle.\");', 'if (latest.details?.graphBundle?.stats?.nodeCount !== 41) throw new Error(\"Fake autopilot did not record the compiled graph bundle.\");'),
              ],
          }
"""
          if anchor not in text:
              raise SystemExit('inventory replacement anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Remove patcher and push the corrected one-shot workflow
        run: |
          git rm .github/workflows/tmp-patch-intuition-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-approve-reconcile-intuition.yml
          git commit -m "chore: patch final intuition reconciliation inventory"
          git push origin HEAD:task/intuition-calibration-20260902
