name: Hypnosis synchronization source snapshot
on:
  push:
    branches: [task/hypnosis-ic-sync-r03-20260911]
    paths: [.github/workflows/hypnosis-sync-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ad441affd378e06d6395e0ba4ec0760eaaea5d52
          path: graph
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: u-dont-existDOTcom/joel-articles
          ref: defc51d43fa291dcb00c93468e111c967094164a
          path: articles
          persist-credentials: false
      - name: Export tracked public sources only
        shell: bash
        run: |
          set -euo pipefail
          mkdir snapshot
          git -C graph archive --format=zip --output="$PWD/snapshot/graph.zip" HEAD
          git -C articles archive --format=zip --output="$PWD/snapshot/articles.zip" HEAD
          git -C graph rev-parse HEAD > snapshot/GRAPH-COMMIT.txt
          git -C articles rev-parse HEAD > snapshot/ARTICLES-COMMIT.txt
          cd snapshot
          sha256sum graph.zip articles.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hypnosis-sync-exact-source
          path: snapshot/
          retention-days: 7
          if-no-files-found: error
